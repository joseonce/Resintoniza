name = resintonizaListViewFix
summary = "Resintoniza: lectura completa de listas"
description = """Amplía el límite de NVDA al leer listas (SysListView32). Permite leer el contenido completo de cada columna al navegar por las listas de canales y de programación, no solo los primeros 511 caracteres, que es lo que corta las descripciones largas de la guía. Pensado para Resintoniza, pero funciona en cualquier aplicación con listas. Se puede desactivar en cualquier momento desde el administrador de complementos de NVDA."""
author = "ANÓNIMO"
url = https://github.com/
version = 1.0.0
minimumNVDAVersion = 2023.1.0
lastTestedNVDAVersion = 2026.1.0
